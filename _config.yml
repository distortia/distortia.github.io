title: Nick Stalter
email: nickstalter@gmail.com
description: >-
  I build small apps and write about how they get made.
tagline: Small apps, and notes on how they get made
url: "https://nickstalter.com"
github_username: distortia
linkedin_url: https://www.linkedin.com/pub/nicholas-stalter/93/205/4b5
timezone: America/New_York
lang: en_US

markdown: kramdown
highlighter: rouge
permalink: /:title
excerpt_separator: "\n\n"

sass:
  style: compressed
  sourcemap: never
  silence_deprecations:
    - import

kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

author:
  name: Nick Stalter
  email: nickstalter@gmail.com

twitter:
  username: ns_mizou
  card: summary_large_image

simple_analytics: true

social:
  name: Nick Stalter
  links:
    - https://github.com/distortia
    - https://www.linkedin.com/pub/nicholas-stalter/93/205/4b5

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .ruby-version
  - .github
