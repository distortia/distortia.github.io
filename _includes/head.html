<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=Newsreader:ital,opsz,wght@0,8..72,400;0,8..72,600;0,8..72,700;1,8..72,400&display=swap">
  <link rel="stylesheet" href="{{ "/css/main.css" | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ "/feed.xml" | relative_url }}">
  <link rel="icon" href="{{ "/img/favicon.svg" | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ "/img/favicon.ico" | relative_url }}" sizes="32x32">
  <link rel="apple-touch-icon" href="{{ "/img/apple-touch-icon.png" | relative_url }}">
  <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  {% if site.simple_analytics %}
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js" data-collect-dnt="true"></script>
    <noscript><img src="https://queue.simpleanalyticscdn.com/noscript.gif?collect-dnt=true" alt="" referrerpolicy="no-referrer-when-downgrade"></noscript>
  {% endif %}
</head>
